name: "CI: Build and Push"

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "*"
  # Without this, the test matrix and the streaming check only ever run once the
  # branch is already merged, which is too late to block anything. `publish` is
  # guarded by a tag ref below, so a pull request runs the checks and nothing
  # else.
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

# Minimal permissions following least privilege principle
permissions:
  contents: read
  actions: read

jobs:
  secrets-scan:
    name: Trufflehog - Secret Detection
    runs-on: ubuntu-latest  # TruffleHog action has issues with self-hosted runners
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for git history scanning
      - name: Run TruffleHog for secrets scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  streaming-check:
    name: Static check - no eager reads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No dependencies on purpose: the checker is stdlib-only AST analysis, so
      # this job answers in seconds and cannot be broken by an install failure.
      - name: Fail on eager reads in the streaming contract
        run: |
          python tests/test_no_eager_reads.py \
            qalita_core/analytics.py \
            qalita_core/profiling.py \
            qalita_core/pack.py
      # Advisory until data_source_opener.py and pandas_sanitization.py finish
      # migrating; make this the blocking step (drop continue-on-error and the
      # step above) once it reports nothing.
      - name: Report eager reads in the rest of the package
        continue-on-error: true
        run: python tests/test_no_eager_reads.py qalita_core --show-waivers

  # Installs from uv.lock: a PR is tested against the dependencies it pins, so
  # it goes red because of its own changes only. Installing with pip resolved
  # the newest releases instead, and on 2026-10-07 polars 2.0.0, then 1.44.2,
  # broke unrelated PRs the day they shipped. Dependency moves now arrive
  # through dependabot's uv.lock PRs, where this job tests them.
  test:
    name: Pytest - Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # --frozen: fail if uv.lock no longer matches pyproject.toml rather than
      # silently re-resolving.
      - name: Install dependencies from uv.lock
        run: uv sync --frozen --extra dev
      - name: Run tests with pytest
        run: uv run --frozen pytest tests/ -v --tb=short

  # What a `pip install qalita-core` user gets: the newest release of every
  # dependency within the declared ranges. Advisory: it reports upcoming
  # breakage early without blocking a PR that did not cause it.
  test-latest:
    name: Pytest - Latest dependencies (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the newest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -e ".[dev]"
      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI & GitHub Release
    needs: [secrets-scan, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest  # setup-python doesn't support Python 3.13 on ARM64
    permissions:
      id-token: write      # Required for OIDC authentication with PyPI
      contents: write      # Required for creating GitHub Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Bump version from tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          sed -i "s/0.0.0-dev/${VERSION}/g" pyproject.toml
          sed -i "s/0.0.0-dev/${VERSION}/g" qalita_core/utils.py
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release with package assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
